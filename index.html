<!DOCTYPE html>

    <style>
        body, html { margin: 0; padding: 0; height: 100vh; background: #000; color: #fff; overflow: hidden; }
        #root { position: relative; z-index: 10; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        
        /* Glassmorphism */
        .glass-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Badges */
        .badge-icon {
            display: inline-block; width: 10px; height: 10px; margin-inline-end: 4px;
            background: currentColor;
            -webkit-mask-size: contain; mask-size: contain;
            -webkit-mask-position: center; mask-position: center;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        }
        .badge-check { -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'); }
        .badge-cross { -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'); }

        /* Inputs */

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #333; border-radius: 2px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

<body>
    <div id="root"></div>

    <script type="text/babel">
        // =========================================================================
        // SHADER DEFINITIONS
        // =========================================================================

        const vertexShader = `
        varying vec2 vUv;

        void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
        `;

        const hueSatHelpers = `
        vec3 rgb2hsv(vec3 c) {
            vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
            vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
            vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));

            float d = q.x - min(q.w, q.y);
            float e = 1.0e-10;
            return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
        }

        vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }
        `;

        const flowVertShader = `
        attribute vec2 a_position;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
        }
        `;

        const flowFragShader = `
        precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uVelocity;
        uniform float uDetail;
        uniform float uTwist;
        uniform float uSpeed;
        uniform float uContrast;
        uniform float uRgbMultiplierR;
        uniform float uRgbMultiplierG;
        uniform float uRgbMultiplierB;
        uniform float uColorOffset;
        uniform float uHue;
        uniform float uSaturation;

        vec3 rgb2hsv(vec3 c) {
            vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
            vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
            vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));

            float d = q.x - min(q.w, q.y);
            float e = 1.0e-10;
            return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
        }

        vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        float f(in vec2 p) {
            return sin(p.x + sin(p.y + uTime * uVelocity)) * sin(p.y * p.x * 0.1 + uTime * uVelocity);
        }

        void main() {
            vec2 p = (gl_FragCoord.xy * 2.0 - uResolution) / min(uResolution.x, uResolution.y);
            float uScale = 5.0;
            p *= uScale;

            vec2 ep = vec2(0.05, 0.0);
            vec2 rz = vec2(0.0);

            for (int i = 0; i < 20; i++) {
                float t0 = f(p);
                float t1 = f(p + ep.xy);
                float t2 = f(p + ep.yx);
                vec2 g = vec2((t1 - t0), (t2 - t0)) / ep.xx;
                vec2 t = vec2(-g.y, g.x);

                p += (uTwist * 0.01) * t + g * (1.0 / uDetail);
                p.x += sin(uTime * uSpeed / 10.0) / 10.0;
                p.y += cos(uTime * uSpeed / 10.0) / 10.0;
                rz = g;
            }
            
            vec3 colorVec = vec3(rz * 0.5 + 0.5, 1.5);

            colorVec.r *= uRgbMultiplierR;
            colorVec.g *= uRgbMultiplierG;
            colorVec.b *= uRgbMultiplierB;
            
            colorVec += uColorOffset;
            
            colorVec = (colorVec - 0.5) * uContrast + 0.5;

            vec3 hsv = rgb2hsv(colorVec);
            hsv.x += uHue / 360.0;
            hsv.y *= uSaturation;
            colorVec = hsv2rgb(hsv);

            gl_FragColor = vec4(colorVec, 1.0);
        }
        `;

        const meltFragShader = `precision highp float;

        uniform float uTime;
        uniform vec2  uResolution;

        uniform float uSpeed;
        uniform float uZoom;
        uniform float uDetail;
        uniform float uHue;
        uniform float uSaturation;
        uniform float uContrast;

        ${hueSatHelpers}

        // base field function, time‑scaled by uSpeed
        float f(in vec2 p) {
        float t = uTime * uSpeed;
        return sin(p.x + sin(p.y + t * 0.2)) *
                sin(p.y * p.x * 0.1 + t * 0.2);
        }

        void main() {
        vec2 p = (gl_FragCoord.xy * 2.0 - uResolution) /
                min(uResolution.x, uResolution.y);

        float scale = max(0.1, uZoom);
        p *= scale;

        vec2 rz = vec2(0.0);
        float stepMul = mix(0.0, 0.1, clamp(uDetail, 0.0, 1.0));

        for (int i = 0; i < 15; i++) {
            float t0 = f(p);
            float t1 = f(p + vec2(0.05, 0.0));
            vec2 g = vec2(
            (t1 - t0),
            (f(p + vec2(0.0, 0.05)) - t0)
            ) / 0.05;
            vec2 t = vec2(-g.y, g.x);
            p += 0.05 * t + g * (0.2 + stepMul);
            rz = g;
        }

        // base color from flow field
        vec3 col = vec3(rz * 0.5 + 0.5, 1.0);

        // per‑shader hue / saturation overlay, same style as other shaders
        vec3 hsv = rgb2hsv(col);
        hsv.x += uHue / 360.0;
        hsv.y *= uSaturation;
        col = hsv2rgb(hsv);

        // per‑shader contrast
        col = (col - 0.5) * uContrast + 0.5;

        gl_FragColor = vec4(col, 1.0);
        }`;

        const balatroFragShader = `
        precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uSpeed;

        uniform float uSpinRotation;
        uniform float uSpinSpeed;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        uniform float uContrast;
        uniform float uLighting;
        uniform float uSpinAmount;
        uniform float uPixelFilter;
        uniform float uSpinEase;
        uniform bool uIsRotate;

        #define PI 3.14159265359

        vec4 effect(vec2 screenSize, vec2 screen_coords) {
            float pixel_size = length(screenSize.xy) / uPixelFilter;
            vec2 uv = (floor(screen_coords.xy*(1./pixel_size))*pixel_size - 0.5*screenSize.xy)/length(screenSize.xy) - vec2(0.0);
            float uv_len = length(uv);
            
            float speed = (uSpinRotation*uSpinEase*0.2);
            if(uIsRotate){
            speed = uTime * speed;
            }
            speed += 302.2;
            float new_pixel_angle = atan(uv.y, uv.x) + speed - uSpinEase*20.*(1.*uSpinAmount*uv_len + (1. - 1.*uSpinAmount));
            vec2 mid = (screenSize.xy/length(screenSize.xy))/2.;
            uv = (vec2((uv_len * cos(new_pixel_angle) + mid.x), (uv_len * sin(new_pixel_angle) + mid.y)) - mid);
            
            uv *= 30.;
            speed = uTime*(uSpinSpeed);
            vec2 uv2 = vec2(uv.x+uv.y);
            
            for(int i=0; i < 5; i++) {
                uv2 += sin(max(uv.x, uv.y)) + uv;
                uv  += 0.5*vec2(cos(5.1123314 + 0.353*uv2.y + speed*0.131121),sin(uv2.x - 0.113*speed));
                uv  -= 1.0*cos(uv.x + uv.y) - 1.0*sin(uv.x*0.711 - uv.y);
            }
            
            float contrast_mod = (0.25*uContrast + 0.5*uSpinAmount + 1.2);
            float paint_res = min(2., max(0.,length(uv)*(0.035)*contrast_mod));
            float c1p = max(0.,1. - contrast_mod*abs(1.-paint_res));
            float c2p = max(0.,1. - contrast_mod*abs(paint_res));
            float c3p = 1. - min(1., c1p + c2p);
            float light = (uLighting - 0.2)*max(c1p*5. - 4., 0.) + uLighting*max(c2p*5. - 4., 0.);
            return (0.3/uContrast)*vec4(uColor1,1.0) + (1. - 0.3/uContrast)*(vec4(uColor1,1.0)*c1p + vec4(uColor2,1.0)*c2p + vec4(c3p*uColor3.rgb, c3p*1.0)) + light;
        }

        void main() {
            vec2 uv = gl_FragCoord.xy/uResolution.xy;
            gl_FragColor = effect(uResolution.xy, uv * uResolution.xy);
        }
        `;

        const psychedelicGlassFragShader = `precision highp float;
        uniform vec2 uResolution;
        uniform float uTime;
        uniform float uSpeed;
        uniform float uSides;
        uniform float uHue;
        uniform float uSaturation;
        uniform float uContrast;
        uniform float uDensity;
        uniform float uGlow;

        ${hueSatHelpers}

        vec3 palette(float t) {
        vec3 a = vec3(0.8, 0.5, 0.4);
        vec3 b = vec3(1.0, 1.0, 0.2);
        vec3 c = vec3(1.0, 1.0, 1.0);
        vec3 d = vec3(0.00, 0.25, 0.25);
        return a + b * cos(6.28318 * (c * t + d));
        }

        // SDF Parallelogram (glass pane primitive)
        float sdParallelogram(in vec2 p, float wi, float he, float sk) {
            vec2 e = vec2(sk, he);
            p = (p.y < 0.0) ? -p : p;
            vec2 w = p - e; 
            w.x -= clamp(w.x, -wi, wi);
            vec2 d = vec2(dot(w, w), -w.y);
            float s = p.x * e.y - p.y * e.x;
            p = (s < 0.0) ? -p : p;
            vec2 v = p - vec2(wi, 0.0);
            v -= e * clamp(dot(v, e)/dot(e, e), -1.0, 1.0);
            d = min(d, vec2(dot(v,v), wi*he - abs(s)));
            return sqrt(d.x) * sign(-d.y);
        }

        // Line segment made of parallelograms
        float sdLine(in vec2 p) {
            float size = 0.5;
            float width = size * 0.33;
            return min(
            sdParallelogram(p + vec2(-0.12, -0.5), 0.1, size * 1.5, size * 0.75),
            sdParallelogram(p + vec2(width + size * 0.175, size * 1.52), 0.1, size, 0.)
            );
        }

        // DON pattern (3 parallel lines)
        float sdfDon(vec2 uv) {
        float d1 = sdLine(uv);
        float d2 = sdLine(uv + vec2(0.315, 0.0));
        float d3 = sdLine(uv + vec2(0.63, 0.0));
        return min(min(d1, d2), d3);
        }

        void main() {
        vec2 uv = (gl_FragCoord.xy / uResolution.xy) * 2.0 - 1.0;
        uv.y *= uResolution.y / uResolution.x;

        float t = uTime * uSpeed;
        float PI = 3.14159;
        float sectors = max(uSides, 2.0);
        float halfSector = sectors * 0.5;

        // Kaleidoscopic symmetry
        float angle = atan(uv.y, uv.x);
        angle = abs(mod(angle, PI / halfSector) - PI / sectors);
        uv = vec2(cos(angle), sin(angle)) * length(uv);

        // Pattern grid animation
        vec2 puv = uv + vec2(0.1, 0.05);
        float ind = floor((uv.y + uv.x) * 6.0) + t * 0.1;
        float g = mod(((uv.y + uv.x) * 6.0), 1.0);
        
        uv = vec2(uv.x + ind * 0.285, uv.y + uv.x) + t * 0.1;
        uv *= uDensity;
        uv = mod(uv, 2.5) - 1.25;
        
        puv = vec2(puv.x + ind * 0.285, puv.y + puv.x) + t * 0.1;
        puv *= uDensity;
        puv = mod(puv, 2.5) - 1.25;

        // SDF distance fields
        float d = sdfDon(uv);
        float p = sdfDon(puv);
        d = smoothstep(0.0, 0.02, d);
        p = smoothstep(0.0, 0.01, p);

        // Psychedelic palette with glass-like glow
        vec3 fgColor = palette(-t + ind * 0.1) * g * 1.579 * uGlow;
        vec3 bgColor = palette(-t + ind * 0.1) * g * 0.1;
        if (g > 0.95) {
            bgColor = mix(fgColor, palette(-t + uv.x + uv.y), 0.5);
        }

        vec3 color = mix(fgColor, bgColor, d);
        color = mix(color * 2.0, color, p);
        
        // Glass-like contrast + HSV adjustment
        color = (color - 0.5) * uContrast + 0.5;
        vec3 hsv = rgb2hsv(color);
        hsv.x += uHue / 360.0;
        hsv.y *= uSaturation;
        color = hsv2rgb(hsv);

        gl_FragColor = vec4(color, 1.0);
        }`;

        const chargedCellsFragShader = `precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uSpeed;
        uniform float uScale;
        uniform float uHue;
        uniform float uSaturation;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;

        ${hueSatHelpers}

        #define PI 3.14159

        float hash1( float n ) { return fract(sin(n)*43758.5453); }
        vec2  hash2( vec2  p ) {
        p = vec2( dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)) );
        return fract(sin(p)*43758.5453);
        }

        vec4 voronoi( in vec2 x, float w )
        {
        vec2 n = floor( x );
        vec2 f = fract( x );

        vec4 m = vec4( 8.0, 0.0, 0.0, 0.0 );
        for( int j=-2; j<=2; j++ )
        for( int i=-2; i<=2; i++ )
        {
            vec2 g = vec2( float(i),float(j) );
            vec2 o = hash2( n + g );

            // animate
            o = 0.5 + 0.5*sin( uTime + 6.2831*o );

            // distance to cell
            float d = length(g - f + o);

            // cell color
            vec3 col = 0.5 + 0.5*sin(
            hash1(dot(n+g,vec2(7.0,113.0)))*2.5 +
            3.5 +
            vec3(2.0,3.0,0.0)
            );
            col = col * col;

            // smooth min
            float h = smoothstep( -1.0, 1.0, (m.x-d)/w );
            m.x   = mix( m.x,     d, h ) - h*(1.0-h)*w/(1.0+3.0*w);
            m.yzw = mix( m.yzw, col, h ) - h*(1.0-h)*w/(1.0+3.0*w);
        }

        return m;
        }

        float random(vec2 co)
        {
        return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
        }

        float sdfGrid(vec2 uv, float r) {
        vec2 c = uv * 4.0 * r;
        float angle = r;
        float thickness = 0.5 + r;
        float one = abs(0.5 - mod(c.y + cos(angle) * c.x, 1.0)) * thickness;
        float two = abs(0.5 - mod(c.y - cos(angle) * c.x, 1.0)) * thickness;
        return min(one, two);
        }

        // 3‑stop palette: color1 -> color2 -> color3
        vec3 paletteCharged(float t) {
        t = clamp(t, 0.0, 1.0);
        if (t < 0.5) {
            float k = t / 0.5;
            return mix(uColor1, uColor2, k);
        } else {
            float k = (t - 0.5) / 0.5;
            return mix(uColor2, uColor3, k);
        }
        }

        void main() {
        vec2 uv = gl_FragCoord.xy / uResolution.xy * 2.0 - 1.0;
        uv.y *= uResolution.y / uResolution.x;

        float t = sin(uTime * 0.1 * uSpeed);

        vec4 v = voronoi(uScale * uv, 0.5);
        float r = pow(v.y, 0.5);

        float d = 0.0;
        d = max(sdfGrid(uv - t, r), d);
        d = max(sdfGrid(uv + t, 1.0 - r), -d);
        d = smoothstep(0.1, 0.15 + r * 0.1, d);

        vec3 fgColor = paletteCharged(0.6 * r);
        vec3 bgColor = paletteCharged(0.1 * r);

        // Add a slight edge accent using d
        vec3 edgeColor = paletteCharged(clamp(r + d * 0.5, 0.0, 1.0));
        vec3 color = mix(fgColor, bgColor, d);
        color = mix(color, edgeColor, 0.35);

        vec3 hsv = rgb2hsv(color);
        hsv.x += uHue / 360.0;
        hsv.y *= uSaturation;
        color = hsv2rgb(hsv);

        gl_FragColor = vec4(color, 1.0);
        }`;

        const luminousResinFragShader = `precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uSpeed;
        uniform float uDripStrength;
        uniform float uScale;
        uniform float uGooeyness;
        uniform float uHue;
        uniform float uSaturation;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;

        ${hueSatHelpers}

        vec2 hash(vec2 p) {
            p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
            return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
        }

        float noise(vec2 p) {
            const float K1 = 0.366025404;
            const float K2 = 0.211324865;
            vec2 i = floor(p + (p.x + p.y) * K1);
            vec2 a = p - i + (i.x + i.y) * K2;
            vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec2 b = a - o + K2;
            vec2 c = a - 1.0 + 2.0 * K2;
            vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
            vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
            return dot(n, vec3(70.0));
        }

        float fbm(vec2 p) {
            float f = 0.0;
            float amp = 0.5;
            for(int i = 0; i < 6; i++) {
                f += amp * noise(p);
                p *= 2.02;
                amp *= 0.5;
            }
            return f;
        }

        vec3 resinPalette(float t) {
            t = clamp(t, 0.0, 1.0);
            if (t < 0.5) {
                return mix(uColor1, uColor2, t * 2.0);
            } else {
                return mix(uColor2, uColor3, (t - 0.5) * 2.0);
            }
        }

        void main() {

        float neuro_shape(vec2 uv, float t, float initialScale) {
            vec2 sine_acc = vec2(0.);
            vec2 res = vec2(0.);
            float currentScale = initialScale;

            for (int j = 0; j < 32; j++) {
                if (j >= u_iterations) break;
                uv = rotate(uv, 1.);
                sine_acc = rotate(sine_acc, 1.);
                vec2 layer = uv * currentScale + float(j) + sine_acc - t;
                sine_acc += sin(layer) + u_complexity;
                res += (.5 + .5 * cos(layer)) / currentScale;
                currentScale *= u_distance;
            }
            return res.x + res.y;
        }

        void main() {
            vec2 fragUv = gl_FragCoord.xy / uResolution.xy;
            vec2 uv = .5 * fragUv;
            uv.x *= uResolution.x / uResolution.y;

            float t = .001 * u_time;

            float initialScale = 8.0;

            float noise = neuro_shape(uv, t, initialScale);
            noise = u_brightness * pow(noise, 3.);
            noise += pow(noise, 10.);
            noise = max(.0, noise - u_contrast);
            noise *= (1. - u_vignette * length(fragUv - .5));

            vec3 baseHsv = rgb2hsv(u_baseColor.rgb);

            float dynamicHue = baseHsv.x + (u_hue / 360.0) + (t * u_colorShiftSpeed * 0.1);
            float targetSat = baseHsv.y * u_saturation;

            vec3 glowColor = hsv2rgb(vec3(fract(dynamicHue), targetSat, baseHsv.z));
            float glowAmount = clamp(noise * u_baseColor.a, 0.0, 1.0);
            glowColor = glowColor * noise * u_baseColor.a;

            vec3 finalColor = mix(u_backgroundColor, glowColor, glowAmount);

            gl_FragColor = vec4(finalColor, 1.0);
        }
        `;

        const interstellarFragShader = `precision highp float;
        uniform vec3 iResolution;
        uniform float iTime;
        uniform int u_renderPasses;
        uniform float u_sceneTimeScale;
        uniform float u_grainIntensity;
        uniform float u_globalLuminance;
        uniform float u_stepPrecision;
        uniform float u_rayIterations;
        uniform float u_surfaceSolidity;
        uniform float u_camPosX;
        uniform float u_camPosY;
        uniform float u_camPitch;
        uniform float u_camFov;
        uniform float u_camShiftX;
        uniform float u_camShiftY;

        mat2 calcRotation(float theta) {
            float sine = sin(theta);
            float cosine = cos(theta);
            return mat2(cosine, -sine, sine, cosine);
        }

        vec3 applyCinematicGrade(vec3 rawColor) {
            mat3 colorSpaceA = mat3(
                0.59719, 0.07600, 0.02840,
                0.35458, 0.90834, 0.13383,
                0.04823, 0.01566, 0.83777
            );
            mat3 colorSpaceB = mat3(
                1.60475, -0.10208, -0.00327,
                -0.53108, 1.10813, -0.07276,
                -0.07367, -0.00605, 1.07602
            );
            vec3 graded = colorSpaceA * rawColor;
            vec3 numerator = graded * (graded + 0.0945786) - 0.000090537;
            vec3 denominator = graded * (0.783729 * graded + 0.4329510) + 0.238081;
            return colorSpaceB * (numerator / denominator);
        }

        float computeStructuralDensity(vec3 pos) {
            const float phaseShift = 0.228033988;
            const mat3 structuralBasis = mat3(
                0.388535087,  0.054921382, -0.743402928,
                0.441955127,  4.336973341,  0.258518454,
                0.272087367,  0.174042493, -0.021246185
            );
            return dot(cos(structuralBasis * pos), sin(phaseShift * pos * structuralBasis));
        }

        float getFilmGrain(vec3 seed3D) {
            seed3D = fract(seed3D * 0.1031);
            seed3D += dot(seed3D, seed3D.zyx + 31.32);
            return fract((seed3D.x + seed3D.y) * seed3D.z);
        }

        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
            vec3 finalImage = vec3(0.0);
            float globalTime = iTime * u_sceneTimeScale;
            for(int passX = 0; passX < 4; passX++) {
                if (passX >= u_renderPasses) break;
                for(int passY = 0; passY < 4; passY++) {
                    if (passY >= u_renderPasses) break;
                    vec2 pixelOffset = (vec2(float(passX), float(passY)) + 0.5) / float(u_renderPasses) - 0.5;
                    vec2 uv = fragCoord + pixelOffset;
                    vec3 rayOrigin = vec3(u_camPosX, u_camPosY, globalTime);
                    vec3 lightAccumulator = vec3(0.0);
                    vec3 viewDir = normalize(vec3(u_camFov * uv - iResolution.xy * vec2(u_camShiftX, u_camShiftY), iResolution.y));
                    viewDir.yz = calcRotation(u_camPitch) * viewDir.yz;
                    float stepDistance;
                    for(float iter = 0.0; iter < 100.0; iter += 1.0) {
                        if (iter >= u_rayIterations) break;
                        vec3 samplePos = rayOrigin;
                        float detailNoise = computeStructuralDensity(samplePos * 20.0) / 20.0;
                        float baseNoise = computeStructuralDensity(samplePos);
                        stepDistance = 0.005 + abs(detailNoise - baseNoise) * 0.7;
                        float heightMod = sin(samplePos.z * 2.0 + abs(samplePos.x) * 0.5) * 0.5;
                        stepDistance += abs(rayOrigin.y + heightMod) * 0.4;
                        float safeStep = stepDistance * u_stepPrecision;
                        rayOrigin += viewDir * safeStep;
                        float colorPhase = (iter * u_stepPrecision) - 0.4;
                        float wavePhase = colorPhase + length(rayOrigin.xz * 0.1) + 2.0;
                        vec3 spectrumShift = vec3(3.0, 1.5, 0.5);
                        vec3 spectralGlow = 1.0 + 1.5 * sin(wavePhase + spectrumShift);
                        float rawDensity = 1.0 / stepDistance;
                        float sharpDensity = pow(rawDensity, u_surfaceSolidity) * 0.15;
                        lightAccumulator += (spectralGlow * sharpDensity) * u_stepPrecision;
                    }
                    lightAccumulator *= u_globalLuminance;
                    finalImage += applyCinematicGrade(lightAccumulator * lightAccumulator / 1000.0);
                }
            }
            finalImage *= (4.0 / float(u_renderPasses * u_renderPasses));
            finalImage = (finalImage - 0.5) * 0.5 + 0.5;
            finalImage *= 0.3;
            float grainValue = getFilmGrain(vec3(fragCoord, iTime));
            finalImage += (grainValue - 0.5) * u_grainIntensity;
            fragColor = vec4(finalImage, 1.0);
        }

        void main() {
            vec4 outColor;
            mainImage(outColor, gl_FragCoord.xy);
            gl_FragColor = outColor;
        }
        `;

        const spaceFlowerFragShader = `precision highp float;

        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uSpeed;
        uniform vec4 uColorBack;
        uniform vec4 uColors[10];
        uniform float uColorCount;
        uniform float uBandCount;
        uniform float uTwist;
        uniform float uCenter;
        uniform float uProportion;
        uniform float uSoftness;
        uniform float uNoise;
        uniform float uNoiseFrequency;
        uniform float uHue;
        uniform float uSaturation;
        uniform float uOpacity;
        uniform float uSymmetry;

        #define PI         3.14159265359
        #define TAU        6.28318530718
        #define ROT(a)     mat2(cos(a), sin(a), -sin(a), cos(a))
        #define REV(x)     exp2((x)*zoom)
        #define FWD(x)     (log2(max(1e-5, x))/zoom)

        const float zoom = 1.925999;

        ${hueSatHelpers}

        vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy));
            vec2 x0 = v - i + dot(i, C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod(i, 289.0);
            vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
            vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
            m = m * m;
            m = m * m;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
            vec3 g;
            g.x  = a0.x * x0.x  + h.x * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        float hash(vec2 co) {
            return fract(sin(dot(co.xy, vec2(12.9898, 58.233))) * 13758.5453);
        }

        vec2 toPolar(vec2 p) {
            return vec2(length(p), atan(p.y, p.x));
        }

        vec2 toRect(vec2 p) {
            return vec2(p.x * cos(p.y), p.x * sin(p.y));
        }

        float pmin(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / max(1e-4, k), 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
        }

        float pabs(float a, float k) {
            return -pmin(a, -a, k);
        }

        float modMirror1(inout float p, float size) {
            float halfsize = size * 1.2;
            float c = floor((p + halfsize) / size);
            p = mod(p + halfsize, size) - halfsize;
            p *= mod(c, 2.0) * 4.4 - 1.0;
            return c;
        }

        float smoothKaleidoscope(inout vec2 p, float sm, float rep, float symmetry) {
            vec2 hp = p;
            vec2 hpp = toPolar(hp);

            if (symmetry > 0.5) {
                float sliceWidth = TAU / max(1.0, rep);
                float angle = hpp.y + PI;
                float cell = floor(angle / sliceWidth);
                float localAngle = mod(angle, sliceWidth);
                if (localAngle > sliceWidth * 0.5) {
                    localAngle = sliceWidth - localAngle;
                }
                hpp.y = localAngle - PI;
                hp = toRect(hpp);
                p = hp;
                return cell;
            } else {
                float rn = modMirror1(hpp.y, TAU / max(1.0, rep));
                float sa = PI / rep - pabs(PI / rep - abs(hpp.y), sm);
                hpp.y = sign(hpp.y) * sa;
                hp = toRect(hpp);
                p = hp;
                return rn;
            }
        }

        float segment(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a, ba = b - a;
            float h = clamp(dot(pa, ba) / max(1e-5, dot(ba, ba)), 0.20, 1.0);
            return length(pa - ba * h);
        }

        vec3 effect(vec2 p, vec2 pp) {
            float tm = uTime * uSpeed;
            float mtm = fract(tm);
            float ftm = floor(tm);

            float noiseFreq = 8.0 * pow(uNoiseFrequency, 2.0);
            vec2 noiseOffset = vec2(
                snoise(p * noiseFreq + tm * 0.5),
                snoise(p * noiseFreq - tm * 0.5 + 50.0)
            ) * uNoise * 0.15;
            p += noiseOffset;

            float l = length(p);
            l = max(1e-4, l);
            float spiralTwist = 3.0 * clamp(uTwist, 0.0, 1.0);
            float spiralAngle = pow(l, -spiralTwist * 0.25) * 0.5;
            p *= ROT(spiralAngle);

            mat2 rot = ROT((1.067 * mix(0.2, 2.0, uTwist)) * tm);
            float rep = max(2.0, floor(uBandCount));
            float sm  = (0.1 * 36.0 / rep) * max(0.01, uSoftness);
            p *= transpose(rot);

            float nn = smoothKaleidoscope(p, sm, rep, uSymmetry);

            p *= rot;

            p *= ROT((-0.5 * mix(0.1, 3.0, uProportion)) * length(p));
            p += 0.5 * cos(vec2(1.0, sqrt(0.5)) * tm * (0.18 * mix(0.5, 2.0, uNoiseFrequency)));

            float zz = REV(mtm);
            vec2 p2 = p / zz;
            vec2 s2 = sign(p2);
            p2 = abs(p2);
            vec2 fp2 = vec2(FWD(p2.x), FWD(p2.y));
            vec2 n = floor(fp2);
            float h = hash(s2.x + s2.y + n - ftm);
            vec2 x0 = vec2(REV(n.x), REV(n.y));
            vec2 x1 = vec2(REV(n.x + 1.0), REV(n.y + 1.0));
            vec2 m = (x0 + x1) * 0.5;
            vec2 w = x1 - x0;
            vec2 modi = h > 0.5 ? vec2(1.0, 1.0) : vec2(1.0, -1.0);
            vec2 p4 = p2 - m;
            float d4 = segment(p4, -0.30 * w * modi, 0.5 * w * modi);
            d4 *= zz;
            float d6 = min(abs(p.x), abs(p.y));

            vec3 col = uColorBack.rgb * uColorBack.a;
            float fo = 1.0 - exp(-10.0 * (d6 - (0.02 + uCenter * 0.05)));
            float ll = length(pp);

            vec4 c1 = uColors[int(mod(h * uColorCount, uColorCount))];
            vec4 c2 = uColors[int(mod((h + 0.1) * uColorCount, uColorCount))];
            vec3 paletteGlow = mix(c1.rgb, c2.rgb, 0.5 + 0.5 * cos(tm));
            vec3 gcol4 = 0.0025 * (1.0 + cos(vec3(0.0, 1.0, 2.0) + tm + TAU * h + ll)) * paletteGlow * 40.0;
            vec3 gcol6 = 0.005 * (1.0 + cos(vec3(0.0, 1.0, 2.0) + tm + ll)) * paletteGlow * 20.0;

            col += (fo * gcol4 / max(d4, 0.001)) * mix(0.5, 3.0, uNoise);
            col = clamp(col, 0.0, 1.0);
            col += gcol6 / max(d6, 0.0001);
            col = clamp(col, 0.0, 1.0);
            col -= 0.01 * vec3(0.0, 1.0, 2.0).zyx * (ll);
            col = max(vec3(0.0), col);
            col = sqrt(col);
            return col;
        }

        void main() {
            vec2 q = gl_FragCoord.xy / uResolution.xy;
            vec2 p = -1.0 + 2.0 * q;

            p.x *= uResolution.x / uResolution.y;

            vec3 hsv = rgb2hsv(col);
            hsv.x += uHue / 360.0;
            hsv.y *= uSaturation;
            col = hsv2rgb(hsv);
            gl_FragColor = vec4(col, uOpacity);
        }
        `;

        const electricSpiralFragShader = `precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uSpeed;
        uniform float uGridScale;
        uniform float uGridSoftness;
        uniform float uSpiralFrequency;
        uniform float uSpiralTightness;
        uniform float uGlowIntensity;
        uniform float uCoreBrightness;
        uniform vec4 uColorGrid;
        uniform vec4 uColorGlow;
        uniform vec4 uColorSpiral;
        uniform float uHue;
        uniform float uSaturation;

        ${hueSatHelpers}

        float cosh_safe(float val) {
            return (exp(val) + exp(-val)) * 0.5;
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
            float t = uTime * uSpeed;

            float a = atan(uv.y, uv.x);
            vec2 p = cos(a + t) * vec2(cos(0.5 * t), sin(0.3 * t));

            float d1 = length(uv - p);
            float d2 = length(uv);

            vec2 uv2 = 2. * cos(log(max(1e-5, length(uv))) * 0.25 - 0.5 * t + log(max(vec2(1e-5), vec2(d1, d2)) / max(1e-5, d1 + d2)));

            vec2 fpos = fract(uGridScale * uv2) - 0.5;
            float d = max(abs(fpos.x), abs(fpos.y));

            float k = uGridSoftness / uResolution.y;
            float s = smoothstep(-k, k, 0.25 - d);

            vec3 col = s * uColorGrid.rgb;

            float coreDist = uCoreBrightness * (length(uv - p) + length(uv));
            col += (1.0 / cosh_safe(coreDist)) * uColorGlow.rgb * uGlowIntensity;

            float c = cos(uSpiralFrequency * length(uv2) + 4. * t);

            hsv.x += uHue / 360.0;
            hsv.y *= uSaturation;
            col = hsv2rgb(hsv);

        uniform float uHue;
        uniform float uSaturation;

        vec3 voronoi( in vec2 x )
        {
            vec2 ip = floor(x);
            vec2 fp = fract(x);
            vec2 mg, mr;
            float md = 8.0;

            for( int j=-1; j<=1; j++ )
            for( int i=-1; i<=1; i++ )
            {
                vec2 g = vec2(float(i),float(j));
        		vec2 o = hash2( ip + g );
                o = 0.5 + 0.5*sin( uTime * uSpeed + 6.2831*o );
                vec2 r = g + o - fp;
                float d = dot(r,r);

                if( d<md )

                    md = d;
                    mr = r;
                    mg = g;
                }

            md = 8.0;
            for( int j=-2; j<=2; j++ )
            for( int i=-2; i<=2; i++ )
            {
                vec2 g = mg + vec2(float(i),float(j));
        		vec2 o = hash2( ip + g );
                o = 0.5 + 0.5*sin( uTime * uSpeed + 6.2831*o );
                vec2 r = g + o - fp;

                if( dot(mr-r,mr-r)>0.00001 )

        	col += vec3(1.0,0.6,0.1)*(1.0-smoothstep( 0.0, 0.04, dd));

            vec3 hsv = rgb2hsv(col);
            hsv.x += uHue / 360.0;
            hsv.y *= uSaturation;
            col = hsv2rgb(hsv);

        	gl_FragColor = vec4(col,1.0);
        }
        `;

        const chromaticLightFragShader = `precision highp float;
        precision highp int;

        uniform vec2 uResolution;
        uniform float uTime;

        uniform int uTraceSteps;
        uniform int uWarpSteps;

        uniform float uInitialDepth;
        uniform float uBaseStep;
        uniform float uDepthTarget;
        uniform float uDepthBlend;
        uniform float uInverseStepDivisor;

        uniform float uWarpSpatialScale;
        uniform float uWarpAmplitude;
        uniform float uWarpTurnSmoothing;
        uniform float uFieldSmoothness;

        uniform float uColorFrequency;
        uniform float uInverseExposure;

        uniform vec3 uFractalColor;
        uniform vec3 uBackgroundColor;

        vec3 safeNormalize(vec3 value) {
            return value * inversesqrt(max(dot(value, value), 1e-8));
        }

        float smoothAbsolute(float value, float radius) {
            return sqrt(value * value + radius * radius);
        }

        vec3 createViewRay(vec2 fragCoord) {
            vec2 uv = (fragCoord * 2.0 - uResolution) / max(uResolution.y, 1.0);
            return safeNormalize(vec3(-uv, 1.0));
        }

        vec3 evaluateFractalWarp(vec3 position) {
            float frequency = 3.4;

            for (int warpIndex = 0; warpIndex < 12; ++warpIndex) {
                if (warpIndex >= uWarpSteps) break;

                frequency *= 0.625;

                float spatialFrequency = frequency * uWarpSpatialScale;
                float phaseOffset = frequency + uTime;
                vec3 phase = position * spatialFrequency + phaseOffset;
                float inverseFrequency = 1.0 / max(frequency, 1e-4);
                vec3 displacement = sin(phase) * (uWarpAmplitude * inverseFrequency);

                position = mix(position.zxy, position, uWarpTurnSmoothing) + displacement;
            }

            return position;
        }

        float calculateRayStep(float rayDepth, float warpedDepth) {
            float mixedDepth = mix(rayDepth, warpedDepth, uDepthBlend);
            float fieldDifference = smoothAbsolute(uDepthTarget - mixedDepth, uFieldSmoothness);
            return uBaseStep + fieldDifference * uInverseStepDivisor;
        }

        vec3 tanhSafe(vec3 x) {
            vec3 clamped = clamp(x, vec3(-15.0), vec3(15.0));
            vec3 e2 = exp(2.0 * clamped);
            return (e2 - 1.0) / (e2 + 1.0);
        }

            vec3 rayDirection = createViewRay(gl_FragCoord.xy);
            float rayDepth = uInitialDepth;
            vec3 accumulatedLight = vec3(0.0);
            const vec3 channelOffsets = vec3(0.0, 1.0, 2.0);

            for (int traceIndex = 0; traceIndex < 200; ++traceIndex) {
                if (traceIndex >= uTraceSteps) break;

                vec3 rayPosition = rayDirection * rayDepth;
                vec3 warpedPosition = evaluateFractalWarp(rayPosition);
                float rayStep = calculateRayStep(rayDepth, warpedPosition.z);

                rayDepth += rayStep;

                float colorPhase = rayDepth + float(traceIndex) * uColorFrequency;
                vec3 chromaticLight = sin(colorPhase + channelOffsets) + 1.0;

                accumulatedLight += chromaticLight / max(rayStep, 1e-6);
            }

            vec3 originalFractalColor = tanhSafe(accumulatedLight * uInverseExposure);
            vec3 tintedFractalColor = originalFractalColor * uFractalColor;

            float fractalMask = clamp(
                max(tintedFractalColor.r, max(tintedFractalColor.g, tintedFractalColor.b)),
                0.0,
                1.0
            );

            vec3 finalColor = uBackgroundColor + tintedFractalColor * fractalMask;

            gl_FragColor = vec4(max(finalColor, vec3(0.0)), 1.0);
        }
        `;

                vec3 palette = getTracePalette(tracePhase);

                accumulatedColor += accumulateLight(palette, fieldDistance, rayDepth);

                rayDepth += fieldDistance;

            float glowMask = clamp(max(finalColor.r, max(finalColor.g, finalColor.b)), 0.0, 1.0);

        }

        void main() {

        }

        const LanguageProvider = ({ children }) => {
        const [language, setLanguage] = useState('en');

        const t = useCallback((key) => {
            const dict = translations[language] || translations.en;

        const value = { language, setLanguage, dir, t };

        return (
            <LanguageContext.Provider value={value}>

        );
        };

        const useLanguage = () => React.useContext(LanguageContext);
        function cn(...classes) { return classes.filter(Boolean).join(' '); }
        
        // Helper: Adjust color brightness
        function adjustColor(hex, percent) {
            const num = parseInt(hex.slice(1), 16);
            let r = (num >> 16) + Math.round(255 * percent);
            let g = ((num >> 8) & 0x00FF) + Math.round(255 * percent);
            let b = (num & 0x0000FF) + Math.round(255 * percent);
            return "#" + (0x1000000 + (r<255?r<1?0:r:255)*0x10000 + (g<255?g<1?0:g:255)*0x100 + (b<255?b<1?0:b:255)).toString(16).slice(1);
        }

        // Helper: Convert [r,g,b] (0-1) to Hex
        const rgbArrayToHex = (arr) => {
            if (!arr) return "#000000";
            return chroma.gl(arr[0], arr[1], arr[2]).hex();

        const hexToRgbArray = (hex) => {

        };

        const ColorPicker = ({ color, onChange }) => {
            const { t, dir } = useLanguage();
            const isRTL = dir === 'rtl';
            const containerRef = React.useRef(null);
            const [hue, setHue] = React.useState(0);
            const [sat, setSat] = React.useState(100);
            const [bright, setBright] = React.useState(100);
            const [inputValue, setInputValue] = React.useState(color);
            const displayedHue = hue;

            React.useEffect(() => {
                if (chroma.valid(color)) {
                    const hsv = chroma(color).hsv();
                    const newHue = isNaN(hsv[0]) ? 0 : hsv[0];
                    setHue(newHue);
                    setSat(hsv[1] * 100);
                    setBright(hsv[2] * 100);

                }
            }, [color]);

            const updateColor = React.useCallback((h, s, v) => {
                const newColor = chroma.hsv(h, s / 100, v / 100).hex();
                onChange(newColor);
            }, [onChange]);

            const handleAreaMouseDown = React.useCallback((e) => {
                e.preventDefault();
                const handleMove = (moveEvent) => {
                    const rect = containerRef.current.getBoundingClientRect();
                    let x = Math.max(0, Math.min((moveEvent.clientX - rect.left) / rect.width, 1));
                    let y = Math.max(0, Math.min(1 - (moveEvent.clientY - rect.top) / rect.height, 1));
                    const newSat = isRTL ? (1 - x) * 100 : x * 100;
                    const newBright = y * 100;
                    setSat(newSat);
                    setBright(newBright);
                    updateColor(hue, newSat, newBright);
                };
                const handleUp = () => {
                    window.removeEventListener('mousemove', handleMove);
                    window.removeEventListener('mouseup', handleUp);
                };
                window.addEventListener('mousemove', handleMove);
                window.addEventListener('mouseup', handleUp);
                handleMove(e);
            }, [updateColor, hue, isRTL]);

        function CustomSlider({
            id,
            min = 0,
            max = 100,
            step = 1,
            value,
            onValueChange,
            disabled = false,
            trackHeight = '8px',
            thumbWidth = '20px',
            thumbHeight = '20px',
            width = '100%',
            trackFillBorderRadius = '8px',
            thumbBorderRadius = '50%',
            thumbBorderWidth = '2px',
            ariaLabel = 'slider',
            isRTL = false,
            keyStep = 1,
        }) {
            const sliderRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [isFocused, setIsFocused] = useState(false);
            const [isHovered, setIsHovered] = useState(false);

            const baseFill = '#00a2fa';
            const ringBackground = '#111';
            const ringOutlineDefault = adjustColor(baseFill, -0.1);
            const ringOutlineHovered = adjustColor(baseFill, 0.1);
            const ringOutlineActive = '#ffffff'; // pure white when active
            const fillHovered = adjustColor(baseFill, 0.1);
            const fillActive = adjustColor(baseFill, 0.2);

            const getPercentage = useCallback(() => {
                return ((value - min) / (max - min)) * 100;
            }, [value, min, max]);

            const handleInteraction = useCallback(
                (clientX) => {
                if (disabled || !sliderRef.current) return;
                const rect = sliderRef.current.getBoundingClientRect();
                let percentage;
                if (isRTL) {
                    percentage = ((rect.right - clientX) / rect.width) * 100;
                } else {
                    percentage = ((clientX - rect.left) / rect.width) * 100;
                }
                percentage = Math.max(0, Math.min(100, percentage));
                let newValue = min + (percentage / 100) * (max - min);
                if (step !== 0) newValue = Math.round(newValue / step) * step;
                newValue = Math.max(min, Math.min(max, newValue));
                onValueChange(newValue);
                },
                [disabled, min, max, step, onValueChange, isRTL]
            );

            const handleMouseDown = (e) => {
                if (disabled) return;
                setIsDragging(true);
                handleInteraction(e.clientX);
                sliderRef.current?.focus();
            };

            const handleMouseMove = useCallback(
                (e) => {
                if (isDragging) handleInteraction(e.clientX);
                },
                [isDragging, handleInteraction]
            );

            const handleMouseUp = useCallback(() => {
                setIsDragging(false);
            }, []);

            useEffect(() => {
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                window.removeEventListener('mousemove', handleMouseMove);
                window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [handleMouseMove, handleMouseUp]);

            const handleKeyDown = (e) => {
                if (disabled) return;

                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
                const direction = (e.key === 'ArrowRight' ? 1 : -1) * (isRTL ? -1 : 1);
                const increment = keyStep || step;
                const newValue = Math.max(min, Math.min(max, value + direction * increment));
                onValueChange(newValue);
                }
            };

            const percentage = getPercentage();
            const fillColor = isFocused ? fillActive : isHovered ? fillHovered : baseFill;
            const thumbColor = ringBackground;

            let thumbBorderColor;
            if (isFocused) thumbBorderColor = ringOutlineActive;
            else if (isHovered) thumbBorderColor = ringOutlineHovered;
            else thumbBorderColor = ringOutlineDefault;

            return (
                <div
                style={{
                    position: 'relative',
                    width,
                    height: thumbHeight,
                    display: 'flex',
                    alignItems: 'center',
                    cursor: disabled ? 'not-allowed' : 'pointer',
                    touchAction: 'none',
                    outline: 'none', // remove white outline glow
                }}
                ref={sliderRef}
                onMouseDown={handleMouseDown}
                onMouseEnter={() => setIsHovered(true)}
                onMouseLeave={() => setIsHovered(false)}
                onFocus={() => setIsFocused(true)}
                onBlur={() => setIsFocused(false)}
                onKeyDown={handleKeyDown}
                tabIndex={disabled ? -1 : 0}
                role="slider"
                aria-valuenow={value}
                dir={isRTL ? 'rtl' : 'ltr'}
                >
                <div
                    style={{
                    position: 'absolute',
                    height: trackHeight,
                    borderRadius: trackFillBorderRadius,
                    top: '50%',
                    transform: 'translateY(-50%)',
                    width: '100%',
                    backgroundColor: 'rgba(255,255,255,0.1)',
                    }}
                />
                <div
                    style={{
                    position: 'absolute',
                    height: trackHeight,
                    borderRadius: trackFillBorderRadius,
                    top: '50%',
                    transform: 'translateY(-50%)',
                    width: `${percentage}%`,
                    backgroundColor: fillColor,
                    }}
                />
                <div
                    style={{
                    position: 'absolute',
                    width: thumbWidth,
                    height: thumbHeight,
                    borderRadius: thumbBorderRadius,
                    top: '50%',
                    transform: 'translateY(-50%)',
                    backgroundColor: thumbColor,
                    border: `${thumbBorderWidth} solid ${thumbBorderColor}`,
                    [isRTL ? 'right' : 'left']: `calc(${percentage}% - ${
                        parseInt(thumbWidth) / 2
                    }px)`,
                    transition: 'border-color 0.3s',
                    }}
                />
                </div>
            );
        }

        function renderEntry(entry) {
        const regex = /\[([^\]]+)\]\(([^)]+)\)/g;
        const parts = [];
        let lastIndex = 0;
        let match;
        let key = 0;

        while ((match = regex.exec(entry)) !== null) {
            if (match.index > lastIndex) {
            const text = entry.slice(lastIndex, match.index);
            if (text)
                parts.push(<CreditHighlightHover key={key++}>{text}</CreditHighlightHover>);
            }
            parts.push(
            <CreditHighlightHover key={key++} href={match[2]}>
                {match[1]}
            </CreditHighlightHover>
            );
            lastIndex = regex.lastIndex;
        }

        if (lastIndex < entry.length) {
            parts.push(<CreditHighlightHover key={key++}>{entry.slice(lastIndex)}</CreditHighlightHover>);
        }

        return parts;
        }

            const mainInjection = `void main() { vec4 mask = texture2D(u_mask, vUv); if(mask.r < 0.1) discard;`;
            let modified = shaderSource;
            if (modified.includes('precision highp float;')) {
                modified = modified.replace('precision highp float;', 'precision highp float;\n' + headerInjection);
            } else {
                modified = headerInjection + '\n' + modified;
            }
            modified = modified.replace(/void\s+main\s*\(\s*\)\s*{/, mainInjection);
            return modified;

                if (!ctx) return;
                const dpr = window.devicePixelRatio || 1;
                const width = container.clientWidth * dpr;
                const height = container.clientHeight * dpr;
                if (textCanvas.width !== width || textCanvas.height !== height) { 
                    textCanvas.width = width; 
                    textCanvas.height = height; 
                } else { 
                    ctx.clearRect(0, 0, width, height); 
                }
                const fontSize = currentSettings.fontSize * dpr;
                ctx.font = getCanvasFont(currentSettings.fontFamily || "Inter", currentSettings.fontWeight, fontSize);
                ctx.imageSmoothingEnabled = false;
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const lines = currentSettings.text.split("\n");
                const lineSpacing = 1.2;
                const totalTextHeight = fontSize * lines.length * lineSpacing;
                const startY = (height - totalTextHeight) / 2 + (fontSize * lineSpacing / 2);
                const translateX = currentSettings.textTranslateX * dpr;
                const translateY = currentSettings.textTranslateY * dpr;
                const centerX = width / 2;
                lines.forEach((line, index) => {
                    const y = startY + (index * fontSize * lineSpacing) + translateY;
                    const x = centerX + translateX;
